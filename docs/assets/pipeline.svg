<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8962e"/></marker>
    <pattern id="clutter" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#3b4652"/><rect x="1" y="2" width="2" height="2" fill="#56626e"/><rect x="4" y="4" width="1" height="1" fill="#6b7682"/></pattern>
  </defs>
  <rect width="960" height="330" rx="14" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#1d2733">SAR ATR pipeline</text>
  <text x="32" y="60" font-size="12.5" fill="#5b6775">From radar chips to a recognition result that is checked for shortcuts</text>

  <!-- 1 data -->
  <g transform="translate(32,86)">
    <rect width="168" height="210" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
    <text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">1 · DATA</text>
    <rect x="34" y="40" width="100" height="100" fill="url(#clutter)"/>
    <rect x="70" y="78" width="30" height="16" fill="#f4f6f8" transform="rotate(-25 85 86)"/>
    <rect x="76" y="94" width="30" height="14" fill="#1b232b" transform="rotate(-25 91 101)"/>
    <text x="84" y="160" font-size="11.5" fill="#1d2733" text-anchor="middle">MSTAR X-band chips</text>
    <text x="84" y="177" font-size="11.5" fill="#1d2733" text-anchor="middle">10 vehicle classes</text>
    <text x="84" y="194" font-size="11" fill="#5b6775" text-anchor="middle">17° train · 15°/30° test</text>
  </g>
  <line x1="204" y1="191" x2="236" y2="191" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- 2 preprocessing -->
  <g transform="translate(240,86)">
    <rect width="168" height="210" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
    <text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">2 · PREPROCESS</text>
    <g font-size="12" fill="#1d2733">
      <text x="14" y="58">• log-magnitude</text>
      <text x="14" y="84">• 100 px context</text>
      <text x="14" y="110">• random 88 px crops</text>
      <text x="14" y="136">• per-chip standardise</text>
      <text x="14" y="162">• target / shadow /</text>
      <text x="26" y="180">clutter masks</text>
    </g>
  </g>
  <line x1="412" y1="191" x2="444" y2="191" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- 3 models -->
  <g transform="translate(448,86)">
    <rect width="190" height="210" rx="10" fill="#2c5578"/>
    <text x="14" y="26" font-size="11" font-weight="700" fill="#f0d79e" letter-spacing=".6">3 · CNN MODELS</text>
    <g fill="#ffffff">
      <rect x="14" y="42" width="162" height="44" rx="6" fill="#3a6a93"/>
      <text x="24" y="61" font-size="12.5" font-weight="700">A-ConvNet</text>
      <text x="24" y="78" font-size="10.5" fill="#d7e3ee">no dense layers · 0.3 M params</text>
      <rect x="14" y="94" width="162" height="44" rx="6" fill="#3a6a93"/>
      <text x="24" y="113" font-size="12.5" font-weight="700">ResNet-18 (scratch)</text>
      <text x="24" y="130" font-size="11" fill="#d7e3ee">3×3 stem, no max-pool</text>
      <rect x="14" y="146" width="162" height="44" rx="6" fill="#3a6a93"/>
      <text x="24" y="165" font-size="12.5" font-weight="700">ResNet-18 (ImageNet)</text>
      <text x="24" y="182" font-size="11" fill="#d7e3ee">transfer-learning baseline</text>
    </g>
  </g>
  <line x1="642" y1="191" x2="674" y2="191" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- 4 evaluation -->
  <g transform="translate(678,86)">
    <rect width="250" height="210" rx="10" fill="#ffffff" stroke="#2c5578" stroke-width="1.5"/>
    <text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">4 · EVALUATION</text>
    <g font-size="12" fill="#1d2733">
      <text x="14" y="56" font-weight="700">SOC / EOC-1 accuracy</text>
      <text x="14" y="72" font-size="11" fill="#5b6775">macro-F1, confusion, per-azimuth</text>
      <text x="14" y="98" font-weight="700">Shortcut test</text>
      <text x="14" y="114" font-size="11" fill="#5b6775">full vs target-only vs background-only</text>
      <text x="14" y="140" font-weight="700">Robustness</text>
      <text x="14" y="156" font-size="11" fill="#5b6775">noise (SNR), corrupted pixels, occlusion</text>
      <text x="14" y="182" font-weight="700">Grad-CAM, measured</text>
      <text x="14" y="198" font-size="11" fill="#5b6775">energy on target · pointing game</text>
    </g>
  </g>
</svg>
